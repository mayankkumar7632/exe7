<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Nexora Tech</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-box auth-box-wide">
      <div class="auth-brand">
        <span class="logo-mark large">N</span>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join Nexora Tech today</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@company.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required>
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="e.g. Engineering">
          </div>
          <div class="form-group form-group-full">
            <label for="role">Register As</label>
            <div class="role-selector">
              <label class="role-option">
                <input type="radio" name="role" value="employee" checked>
                <span class="role-card">
                  <span class="role-icon">👷</span>
                  <span class="role-label">Employee</span>
                </span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="admin">
                <span class="role-card">
                  <span class="role-icon">👨‍💼</span>
                  <span class="role-label">Admin</span>
                </span>
              </label>
            </div>
          </div>
        </div>
        <div id="message" class="form-message"></div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
